
<form>
	<div class="mb-3 row">
		<label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Full text search:</label>
		<div class="col-xs-3 col-sm-auto">
			<input
				id="table-complete-search"
				type="text"
				class="form-control"
				name="searchTerm"
				[(ngModel)]="searchTerm"
			/>
		</div>
	</div>

	<table class="table table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col" sortable="name">Country</th>
                <!-- (sort)="onSort($event) -->
				<th scope="col" sortable="area">Area</th>
				<th scope="col" sortable="population">Population</th>
			</tr>
		</thead>
		<tbody>
			@for (commande of commandes; track commande.id) {
				<tr>
					<th scope="row">{{ commande.id }}</th>
					<td>
						<ngb-highlight [result]="commande.client.nom_complet" [term]="searchTerm" />
					</td>
					<td><ngb-highlight [result]="commande.ref_code| number" [term]="searchTerm" /></td>
					<td><ngb-highlight [result]="commande.date_commande.toDateString()" [term]="searchTerm" /></td>
				</tr>
			} @empty {
				<tr>
					<td colspan="4" style="text-align: center">No countries found</td>
				</tr>
			}
		</tbody>
	</table>

	<div class="d-flex justify-content-between p-2">
		<ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="pageSize">
		</ngb-pagination>

		<select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="pageSize">
			<option [ngValue]="2">2 items per page</option>
			<option [ngValue]="4">4 items per page</option>
			<option [ngValue]="6">6 items per page</option>
		</select>
	</div>
</form>

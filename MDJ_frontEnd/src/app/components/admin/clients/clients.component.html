<table class="user-list">
    <thead>
        <tr>
            <th>Nom complet</th>
            <th>Téléphone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let user of users">
            <td>{{ user.nom_complet }}</td>
            <td>{{ user.phone_number }}</td>
            <td>
                <button class="action-btn view-btn" (click)="viewOrders(user.id)">Voir commandes</button>
                <button class="action-btn edit-btn"><a class="w-100 h-100 text-decoration-none" style="color:inherit" [routerLink]="['/infos-client',user.phone_number]">Modifier</a></button>
                <button class="action-btn delete-btn" (click)="deleteUser(user.phone_number)">Supprimer</button>
            </td>
        </tr>
    </tbody>
</table>

	<div class="mb-3 row">
		<h2 class="d-flex align-items-center gap-2">
			<img src="/assets/img/seller.png" alt="Illustration livraison" class="img-fluid mb-3 " style="max-height: 150px;">
			<span class="reviews-title ">Mes Clients</span>
		</h2>
<form class="col-xs-3 col-sm-auto">

		<label for="table-complete-search" class="col-form-label fs-5">Rechercher un client par nom ou numéro</label>
		<div class="w-100">
			<input
				id="table-complete-search"
				type="text"
				class="form-control w-100"
				name="searchTerm"
				[(ngModel)]="searchTerm"
                (input)="onSearch()"
				placeholder="abou"
				style="min-width:400px;"
			/>
		</div>
</form>

		<!-- @if (user) {
			<span class="col col-form-label">Loading...</span>
		} -->
	</div>

	<table class="table table-striped user-list overflow-x-auto">
		<thead>
			<tr>
				<th scope="col" >Nom Complet</th>
				<th scope="col">Téléphone</th>
				<th scope="col" class="static-right">Actions</th>
			</tr>
		</thead>
		<tbody>
			@for (user of users; track user.id) {
				<tr>
					<td><ngb-highlight [result]="user.nom_complet" [term]="searchTerm" /></td>
					<td><ngb-highlight [result]="user.phone_number" [term]="searchTerm" /></td>
                    <td>
                        <!-- <button class="action-btn view-btn" (click)="viewOrders(user.phone_number)">Voir commandes</button> -->
                        <!-- <button class="action-btn edit-btn"><a class="w-100 h-100 text-decoration-none" style="color:inherit" [routerLink]="['/mdj_admin/infos-client',user.slug]">Modifier</a></button> -->
                        <button class="action-btn delete-btn" (click)="deleteUser(user.slug)">Supprimer</button>
                    </td>

				</tr>
			} @empty {
				<tr>
					<td colspan="4" class="bg-warning" style="text-align: center">Aucun client trouvé.</td>
				</tr>
			}
		</tbody>
	</table>

	<div *ngIf="users.length" class="d-flex justify-content-between p-2">
		<ngb-pagination (pageChange)="loadUsers()" [collectionSize]="totalItems" [(page)]="page" [pageSize]="pageSize">
		</ngb-pagination>
        <p>{{totalItems}} clients au total</p>
	</div>

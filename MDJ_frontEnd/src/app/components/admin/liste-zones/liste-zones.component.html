<div class="container mt-4">
    <div class="row mb-4">
      <div class="col">
        <h2>Gestion des Zones de Livraison</h2>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary">
          <i class="bi bi-plus-circle me-2"></i>Nouvelle Zone
        </button>
      </div>
    </div>
  
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    
      <div class="col">
        <div class="card h-100 add-zone-card">
            <a class="add-zone-card card h-100 w-100 text-decoration-none" [routerLink]="['/mdj_admin/creer-zone']">
          <div class="card-body d-flex justify-content-center align-items-center">
            <button class="btn btn-link text-primary" style="text-decoration: none;">
              <i class="bi bi-plus-circle" style="font-size: 2rem;"></i>
              <h5 class="mt-2">
                Ajouter une zone</h5>
            </button>
          </div>
        </a>
        </div>
      </div>
      
      <div class="col" *ngFor="let zone of zones">
        <div class="card h-100 zone-card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Zone {{ zone.numero }}</h5>
            <div class="btn-group ">
              <button class="mx-1 btn btn-sm btn-outline-primary" >
                <i class="bi bi-pencil"></i>
              </button>
              <button class="mx-1 btn btn-sm btn-outline-danger" >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
          <div class="card-body">
            <h6 class="card-title">{{ zone.nom }}</h6>
            <div class="price-tag my-3">
              <span class="price">{{ zone.prix_livraison }} FCFA</span>
            </div>
            <p class="card-text">
              <i class="bi bi-info-circle me-2"></i>
              <span class="fw-bold">Détails</span><br>
              {{ zone.info }}
            </p>
          </div>
        </div>
      </div>
    </div>
  
    <div *ngIf="zones.length === 0" class="alert alert-info mt-4" role="alert">
      <i class="bi bi-info-circle me-2"></i>
      Aucune zone de livraison n'a été enregistrée.
    </div>
  </div>

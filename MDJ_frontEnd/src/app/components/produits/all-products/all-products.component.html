<div class="product-grid">
  <h2 class="product-grid__title">Tous les produits</h2>
  <div class="product-grid__container">
    @if (produits && produits.length > 0) {
      @for (item of produits; track item) {
        @if (item.QuantiteStock > 0) {
          <div class="product-item">
            <a [routerLink]="['/produits', item.slug]" class="product-item__link">
              <div class="product-item__img-container">
                @if (item.neuf) {
                  <div class="product-item__new-badge">NEUF</div>
                }
                @if (item.special) {
                  <div class="product-item__crown">
                    <img src="../../../../assets/img/king.png" alt="" srcset="">
                  </div>
                }
                <img 
                  [ngSrc]="item.images[0].image" 
                  [width]="300" 
                  [height]="400"
                  [alt]="item.nom"
                  class="product-item__img"
                  loading="lazy"
                >
              </div>
              <div class="product-item__info">
                <div class="product-item__name">{{ item.nom }}</div>
                <div class="product-item__price">{{ item.prix }} FCFA</div>
              </div>
            </a>
          </div>
        }
      }
    } @else {
      <div class="product-grid__empty">
        <div class="product-grid__empty-content">
          <svg xmlns="http://www.w3.org/2000/svg" class="product-grid__empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="18" rx="2"/>
            <path d="M12 8v8"/>
            <path d="M8 12h8"/>
          </svg>
          <h3 class="product-grid__empty-title">Aucun produit disponible</h3>
          <p class="product-grid__empty-text">Notre catalogue est en cours de mise à jour</p>
        </div>
      </div>
    }
  </div>
</div>

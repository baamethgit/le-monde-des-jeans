<section class="container-md container-fluid py-5">
    <div class="row align-items-center justify-content-center h-100">
      <!-- Image Section -->
      <div class="col-md-6 mb-4 mb-md-0">
        <div class="login-image-container rounded-3 overflow-hidden shadow">
          <img src="../../../../assets/img/men39s-clothes-hanger-generative-ai.jpg" 
               alt="Fashion Login Image" 
               class="img-fluid object-fit-cover">
        </div>
      </div>
  
      <!-- Login Form Section -->
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <form [formGroup]="loginForm" (ngSubmit)="loginUser()" class="needs-validation">
              <!-- Header -->
              <div class="text-center mb-4">
                <h3 class="fw-bold mb-2">Connexion</h3>
                <p class="text-muted">
                  Je n'ai pas encore de compte, 
                  <a routerLink="/inscription" class="text-primary text-decoration-none">
                    créer un compte
                  </a>
                </p>
              </div>
  
              <!-- Phone Number Field -->
              <div class="form-floating mb-3">
                <input type="text" 
                       id="phone_number" 
                       formControlName="phone_number" 
                       class="form-control" 
                       placeholder="+221 |"
                       [class.is-invalid]="loginForm.controls['phone_number'].invalid && 
                                        (loginForm.controls['phone_number'].dirty || 
                                         loginForm.controls['phone_number'].touched)">
                <label for="phone_number">Numéro de Téléphone</label>
                
                <!-- Error Messages -->
                <div class="invalid-feedback" *ngIf="loginForm.controls['phone_number'].invalid && 
                     (loginForm.controls['phone_number'].dirty || loginForm.controls['phone_number'].touched)">
                  <small *ngIf="loginForm.controls['phone_number'].hasError('required')">
                    Ce champ est obligatoire
                  </small>
                  <small *ngIf="loginForm.controls['phone_number'].hasError('email') || 
                              loginForm.controls['phone_number'].hasError('validMail')">
                    Veuillez saisir un numéro de téléphone valide
                  </small>
                </div>
              </div>
  
              <!-- Password Field -->
              <div class="form-floating mb-3">
                <div class="input-group">
                  <input [type]="InputType" 
                         id="password" 
                         formControlName="password" 
                         class="form-control border-end-0" 
                         placeholder="Mot de passe"
                         [class.is-invalid]="loginForm.controls['password'].invalid && 
                                          (loginForm.controls['password'].dirty || 
                                           loginForm.controls['password'].touched)">
                  <button class="btn btn-outline-secondary border border-start-0" 
                          type="button" 
                          (click)="togglePassword()">
                    <i [class]="InputType === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                  </button>
                </div>
                
                <!-- Error Message -->
                <div class="invalid-feedback" *ngIf="loginForm.controls['password'].invalid && 
                     (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)">
                  <small *ngIf="loginForm.controls['password'].hasError('required')">
                    Ce champ est obligatoire
                  </small>
                </div>
              </div>
  
              <!-- Forgot Password Link -->
              <div class="d-flex justify-content-end mb-4">
                <a routerLink="/resetpwd" class="text-primary text-decoration-none small">
                  Mot de passe oublié ?
                </a>
              </div>
  
              <!-- Error Message -->
              <div *ngIf="loginError" class="alert alert-danger text-center small" role="alert">
                {{ loginError }}
              </div>
  
              <!-- Submit Button -->
              <button type="submit" 
                      class="btn btn-primary w-100 py-2 mb-3"
                      [disabled]="loginForm.invalid">
                <span>Se Connecter</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

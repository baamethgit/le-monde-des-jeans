<section class="container-fluid container-md">
<app-checkout-progress-bar [currentStep]="CheckoutStep" class="sticky-top bg-info" style="top:60px;z-index:3000;"></app-checkout-progress-bar>

<section class="row position-relative">
  <div class="col-12 col-md-8 table-panier">
    <div class="d-flex justify-content-between mx-4 mx-md-0 justify-content-md-around">
      <h6>Produit</h6>
      <h6>Prix</h6>
    </div>
    <div class="list-item-container" *ngFor="let prod of panier.produits; let i=index">
      <app-item-panier [produit]="prod"></app-item-panier>
    </div>
  </div>
  <div class="col-10 col-sm-8 col-md-4 border rounded-2 p-3 mx-auto">
    <h4>RESUME DU PANIER</h4>
    <p class="fw-bold text-danger">Frais de livraison non inclus à ce stade.</p>

  <div class="delivery-options ">
    <label class="option">
      <input type="radio" name="deliveryOption" [(ngModel)]="selectedOption" value="livraison">
      <span class="radio-button"></span>
      <span class="label-text">Livraison : 24h</span>
    </label>
    
    <label class="option">
      <input type="radio" name="deliveryOption" [(ngModel)]="selectedOption" value="recuperation">
      <span class="radio-button"></span>
      <span class="label-text">Récupération</span>
    </label>
  </div>
  <p class="fw-bold mt-3 d-flex justify-content-between align-items-center">
    <span>Total</span>
    <span>12000 frcs</span>
  </p>
  <button class="my-1 w-75 mx-auto bg-dark rounded-3 border-0 p-2" style="color:white">Continuer</button>
</div>
</section>
</section>
